<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌦️ Weather App</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>🌦️ Weather App</h2>

      <div class="input">
        <input type="text" id="input-city" placeholder="Enter city..." />
        <button id="search-btn">Search</button>
      </div>

      <div class="weather-info">

        <p id="temperature">🌤️ 29°C</p>
        
        <p id="city-name">📍Pune</p>

        <p id="weather-condition">Clear Sky</p>

        <p id="humidity">Humidity: 65%</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
