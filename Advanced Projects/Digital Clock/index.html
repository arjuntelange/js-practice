<!-- 📘 Digital Clock — Project Idea
✅ Features
live current time
updates every second
hours : minutes : seconds -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>

    <style>
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100vh;

            background: #333;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #clock {
            padding: 10px 15px;

            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;

            color: #f5f5f5;
            font-size: 2rem;
        }
    </style>
</head>

<body>
    <div id="clock"></div>

    <script src="script.js"></script>
</body>

</html>
